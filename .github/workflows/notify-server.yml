name: Notify Server

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VERSION_BOT_APP_ID }}
          private-key: ${{ secrets.VERSION_BOT_PRIVATE_KEY }}
          owner: octomil
          repositories: octomil-server

      - name: Get version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch to server
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: octomil/octomil-server
          event-type: sdk-release
          client-payload: '{"sdk": "browser", "version": "${{ steps.version.outputs.version }}"}'
