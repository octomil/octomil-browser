name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 25
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      - run: pnpm run exports:check

      - run: pnpm run pack:check

      - run: pnpm run openapi:check

  ci-complete:
    timeout-minutes: 5
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - test
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verify CI jobs succeeded
        run: |
          set -euo pipefail
          results='${{ toJSON(needs.*.result) }}'
          echo "Needed job results: ${results}"
          if echo "${results}" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::One or more CI jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "CI complete."
